# Windows 7+ 兼容构建所需的工具链（见 docs/win7-support-plan.md 第 5 章步骤 1）
#
# - **nightly**：`x86_64-win7-*` 是 tier-3 目标，rustup 不提供预编译 std
#   （`rustup target add` 会报 "has no prebuilt artifacts available"），
#   只能用 `-Z build-std` 现场编译 std；
# - **gnu 宿主**：本机没有 MSVC 链接器（`link.exe` 缺失，连 build script 都链不出来），
#   而且 build.rs 已经依赖 MinGW 的 windres。
#
# 为什么这里只写 `nightly-x86_64-pc-windows-gnu` 而不带日期：
# rustup 的工具链文件解析**拒绝** `<channel>-<发布日期>-<宿主三元组>` 这种完整写法
# （实测报错 `target tuple in channel name`），带日期就只能落到 msvc 宿主。
# 因此"锁到具体构建"这件事放在发布链上表达：CI 与发布构建使用完整名
# `nightly-2026-10-27-x86_64-pc-windows-gnu`（见 README「构建与运行」与
# .github/workflows/release.yml）。本地开发用这个浮动条目即可，rustup 装上后不会自动升级。
[toolchain]
channel = "nightly-x86_64-pc-windows-gnu"
components = ["rust-src"]
