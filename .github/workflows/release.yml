name: Release

# 推送到 main 即自动编译 Release 并在 Releases 页面发布；
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布 Release 需要写 contents 权限。
permissions:
  contents: write

# 串行执行，不取消进行中的构建。
# 发布流程会改动 tag 与 release，被中途取消会留下「tag 已移动但 release 未更新」的
# 不一致状态；排队执行更安全（有 rust-cache，单次约 1 分钟）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 发布产物的目标与工具链（见 docs/win7-support-plan.md 第 5 章步骤 1/6）：
# - 目标 x86_64-win7-windows-gnu：Windows 7 兼容目标。该目标没有预编译 std，
#   必须 -Z build-std 现场编译，所以工具链必须是 nightly；
# - 工具链锁到**具体日期**：tier-3 目标无 CI 保障，浮动 nightly 可能某天直接编不过。
#   仓库根的 rust-toolchain.toml 只能写浮动名（rustup 不接受 <channel>-<日期>-<宿主> 写法），
#   所以这里显式指定完整名，保证发布可复现。
env:
  TOOLCHAIN: nightly-2026-10-27-x86_64-pc-windows-gnu
  TARGET: x86_64-win7-windows-gnu

jobs:
  build-release:
    name: 编译并发布 Release
    # 必须是 Windows：build.rs 需要资源编译器嵌入图标与清单（GNU 走 MinGW 的 windres），
    # 且依赖链中的 Win32 API 绑定只能在 Windows 目标上链接。
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      # GNU 宿主工具链的链接器（gcc）、build.rs 的资源编译器（windres）以及兼容性闸门
      # 要用的 objdump 都来自 MinGW。镜像自带 MSYS2，把它的 bin 目录挂到 PATH 最前。
      - name: 准备 MinGW（gcc / windres / objdump）
        shell: pwsh
        run: |
          $mingw = 'C:\msys64\mingw64\bin'
          foreach ($tool in @('gcc.exe', 'windres.exe', 'objdump.exe')) {
            if (-not (Test-Path (Join-Path $mingw $tool))) { throw "缺少 $mingw\$tool" }
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $mingw 'gcc.exe') --version | Select-Object -First 1

      - name: 安装锁定版本的 Rust nightly（含 rust-src 与 rust-mingw）
        shell: pwsh
        run: |
          # rust-src：-Z build-std 需要 std 源码；rust-mingw：GNU 目标的导入库与 crt。
          rustup toolchain install ${{ env.TOOLCHAIN }} `
            --profile minimal --component rust-src --component rust-mingw
          rustup run ${{ env.TOOLCHAIN }} rustc --version

      - name: 缓存 cargo 构建（加速后续构建）
        uses: Swatinem/rust-cache@v2
        with:
          # 每个目标的产物分开缓存，避免与本地/其他目标互相挤掉。
          key: ${{ env.TARGET }}

      - name: 读取版本号（以 Cargo.toml 为唯一来源）
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' |
                  Select-Object -First 1
          if (-not $line) { throw '无法从 Cargo.toml 解析 version' }
          $version = $line.Matches[0].Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "版本号：$version"

      - name: 编译 Release（Windows 7 兼容目标）
        run: cargo +${{ env.TOOLCHAIN }} build --release --locked -Z build-std --target ${{ env.TARGET }}

      - name: Windows 7 兼容性闸门 + 体积校验
        shell: pwsh
        run: |
          $exe = 'target/${{ env.TARGET }}/release/pixshot.exe'
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }

          # 兼容性闸门：导入表里不得出现任何 Windows 8 / 10 才有的依赖
          # （api-set 模块，或 DLL 在但函数不存在的入口点）。这是"能在 Windows 7 启动"
          # 的唯一可自动化保障，与 scripts\ci.ps1 第 5 步同源。
          $dump = (& objdump -p $exe 2>&1 | Out-String)
          $pattern = 'api-ms-win|bcryptprimitives|WaitOnAddress|WakeByAddress|ProcessPrng|' +
                     'GetSystemTimePreciseAsFileTime|GetHostNameW|RoOriginateErrorW|' +
                     'GetDpiFor|SetProcessDpiAwareness|ThreadDpiAwarenessContext|SetProcessDPIAware'
          $hit = @(($dump -split "`r?`n") | Where-Object { $_ -match $pattern })
          if ($hit.Count -gt 0) {
            $hit | ForEach-Object { Write-Host $_ }
            throw ('产物含 {0} 处 Win8/10 专属依赖，在 Windows 7 上会启动失败' -f $hit.Count)
          }
          Write-Host '兼容性闸门通过：导入表无 api-set / Win8+ 依赖'

          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ('产物体积 {0:N2} MB' -f $mb)
          # 与 scripts\ci.ps1 一致的体积护栏：防止依赖/特性膨胀。
          if ($mb -gt 3.0) { throw ('体积 {0:N2} MB 超出 3.0 MB 上限' -f $mb) }

      - name: 打包发布文件（重命名 + 校验和）
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $src = 'target/${{ env.TARGET }}/release/pixshot.exe'
          # 分发时按版本改名，且不带空格，方便直接下载运行。
          $name = "pixshot-lite-v$version-x64.exe"
          $outDir = 'target/${{ env.TARGET }}/release'
          Copy-Item $src "$outDir/$name"
          $hash = (Get-FileHash "$outDir/$name" -Algorithm SHA256).Hash
          "$hash  $name" | Out-File -FilePath "$outDir/SHA256SUMS.txt" -Encoding ascii
          "asset=$outDir/$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sums=$outDir/SHA256SUMS.txt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256: $hash"

      # tag 与 release 一一对应，所以同一版本重复推送时 tag 必须跟到最新提交，
      # 否则 release 里的 exe 是本次代码、tag 却停在首个提交，源码与二进制对不上。
      - name: 让 tag 跟随最新提交（同版本重复发布时）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "v${{ steps.version.outputs.value }}"
          $repo = '${{ github.repository }}'
          gh api "repos/$repo/git/ref/tags/$tag" --silent 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "tag $tag 已存在，移动到 ${{ github.sha }}"
            gh api -X PATCH "repos/$repo/git/refs/tags/$tag" `
              -f sha='${{ github.sha }}' -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "移动 tag $tag 失败" }
          } else {
            Write-Host "tag $tag 不存在，将由发布步骤在当前提交上创建"
          }
          # 探测用的 gh api 在 tag 不存在时返回 404，$LASTEXITCODE 会残留非 0；
          # 步骤结束时 PowerShell 会把它当作本步退出码，故显式收尾。
          exit 0

      - name: 生成 Release 说明
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm') + ' UTC'
          @"
          PixShot Lite v$version

          精简版 Windows 桌面工具：框选截图 / 贴图置顶（Rust + Win32，单文件免安装）。

          **系统要求：Windows 7 SP1 及以上（x64，含 Windows 8 / 8.1 / 10 / 11）。**

          - 提交：${{ github.sha }}
          - 构建时间：$stamp
          - 构建目标：``${{ env.TARGET }}``（``${{ env.TOOLCHAIN }}``，现场编译 std）
          - SHA256：${{ steps.package.outputs.sha256 }}

          下载下方的 ``pixshot-lite-v$version-x64.exe`` 直接运行，无需安装、无需额外运行时。

          > **Windows 7 / 8 上的能力降级**（系统本身没有对应 API，程序会自动回退）：
          > - DPI 感知只能到**系统级**；每显示器感知需要 Windows 8.1 起步，
          >   多显示器缩放比例不同时截图与贴图坐标可能有偏差；
          > - 没有 Mica / 圆角 / 深色标题栏（Win10/11 的 DWM 能力），界面为实色表面；
          > - 窗口「排除出截屏捕获」需要 Windows 10 2004 起步，更早系统上会自动跳过
          >   （第三方截图工具可能拍到本程序自己的悬浮窗口）。

          > 本 Release 跟随 main 分支更新：同一版本号重复推送会刷新这里的附件与 tag，
          > 不会新增一条 Release。需要留档某次具体构建，请到 Actions 页面下载该次运行的产物；
          > 需要新增一条 Release，请先提升 Cargo.toml 里的 version。
          "@ | Out-File -FilePath 'release_notes.md' -Encoding utf8

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          # 版本号即 release 身份：已存在则原地更新，不存在则新建。
          tag_name: v${{ steps.version.outputs.value }}
          name: PixShot Lite v${{ steps.version.outputs.value }}
          body_path: release_notes.md
          make_latest: true
          # 产物缺失时直接失败，避免发布出没有附件的空 release。
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.sums }}
